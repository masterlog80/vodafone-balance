name: Container image size

on:
  pull_request:
    branches: [main]
    paths:
      - "Dockerfile"
      - "requirements.txt"
      - "app.py"
      - ".github/workflows/image-size.yml"
  push:
    branches: [main]
    paths:
      - "Dockerfile"
      - "requirements.txt"
      - "app.py"
      - ".github/workflows/image-size.yml"

permissions:
  contents: read

jobs:
  build-and-check-size:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build image
        run: docker build --pull --tag vodafone-balance:sizecheck .

      - name: Enforce 1.3 GB image-size limit
        shell: bash
        run: |
          set -euo pipefail
          size="$(docker image inspect --format='{{.Size}}' vodafone-balance:sizecheck)"
          limit=1300000000
          size_gb="$(awk -v bytes="$size" 'BEGIN { printf "%.3f", bytes / 1000000000 }')"
          echo "Built image size: ${size} bytes (${size_gb} GB decimal)"
          echo "Maximum allowed: ${limit} bytes (1.300 GB decimal)"
          if (( size > limit )); then
            echo "::error::Container image exceeds the 1.3 GB limit."
            exit 1
          fi
