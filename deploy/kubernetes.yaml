apiVersion: v1
kind: ServiceAccount
metadata:
  name: vodafone-balance-sa
  namespace: default
---
# Read only this application's own Pod object to display the running image:tag.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: vodafone-balance-pod-reader
  namespace: default
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: vodafone-balance-pod-reader
  namespace: default
subjects:
  - kind: ServiceAccount
    name: vodafone-balance-sa
    namespace: default
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: vodafone-balance-pod-reader
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: vodafone-balance-profile
  namespace: default
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vodafone-balance
  namespace: default
  labels:
    app.kubernetes.io/name: vodafone-balance
spec:
  replicas: 1
  strategy:
    type: Recreate
    rollingUpdate: null
  selector:
    matchLabels:
      app.kubernetes.io/name: vodafone-balance
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vodafone-balance
    spec:
      serviceAccountName: vodafone-balance-sa
      automountServiceAccountToken: true
      securityContext:
        fsGroup: 10001
      containers:
        - name: app
          image: ghcr.io/masterlog80/vodafone-balance:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
            - name: novnc
              containerPort: 6080
          env:
            - name: PROFILE_DIR
              value: /data/profile
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: IMAGE_NAME
              value: ghcr.io/masterlog80/vodafone-balance:latest
            - name: APP_USERNAME
              valueFrom:
                secretKeyRef:
                  name: vodafone-balance-auth
                  key: username
            - name: APP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: vodafone-balance-auth
                  key: password
          volumeMounts:
            - name: profile
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
      volumes:
        - name: profile
          persistentVolumeClaim:
            claimName: vodafone-balance-profile
---
apiVersion: v1
kind: Service
metadata:
  name: vodafone-balance
  namespace: default
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: vodafone-balance
  ports:
    - name: http
      port: 8080
      targetPort: http
