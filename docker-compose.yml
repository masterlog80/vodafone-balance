services:
  vodafone-balance:
    image: zot.salvetti.info/vodafone-balance:latest
    container_name: vodafone-balance
    restart: unless-stopped
    environment:
      APP_USERNAME: ${APP_USERNAME:?Set APP_USERNAME in your environment}
      APP_PASSWORD: ${APP_PASSWORD:?Set APP_PASSWORD in your environment}
      PROFILE_DIR: /data/profile
      IMAGE_NAME: zot.salvetti.info/vodafone-balance:latest
    ports:
      - "127.0.0.1:8080:8080"
      # noVNC is bound to localhost only; never publish it publicly.
      - "127.0.0.1:6080:6080"
    volumes:
      - vodafone-balance-profile:/data
    shm_size: "1gb"
volumes:
  vodafone-balance-profile:
