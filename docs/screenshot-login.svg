<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650">
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#192746"/><stop offset="1" stop-color="#0b1020"/></linearGradient><linearGradient id="red"><stop stop-color="#ff3434"/><stop offset="1" stop-color="#c80000"/></linearGradient></defs><rect width="1200" height="650" fill="url(#bg)"/><rect x="280" y="52" width="640" height="522" rx="22" fill="#131c30" stroke="#28364f"/><rect x="328" y="90" width="48" height="48" rx="14" fill="url(#red)"/><text x="352" y="122" font-family="Arial,sans-serif" font-size="27" font-weight="bold" fill="#fff" text-anchor="middle">V</text><text x="393" y="104" font-family="Arial,sans-serif" font-size="12" letter-spacing="2" font-weight="bold" fill="#ff8585">AUTHENTICATION</text><text x="393" y="129" font-family="Arial,sans-serif" font-size="25" font-weight="bold" fill="#edf4ff">Vodafone browser session</text><text x="328" y="186" font-family="Arial,sans-serif" font-size="18" font-weight="bold" fill="#edf4ff">Complete the first login manually</text><text x="328" y="217" font-family="Arial,sans-serif" font-size="15" fill="#8ea1bd">1. Open the noVNC session using a local kubectl port-forward.</text><text x="328" y="244" font-family="Arial,sans-serif" font-size="15" fill="#8ea1bd">2. Select Privato and sign in to Vodafone Fai da te.</text><text x="328" y="271" font-family="Arial,sans-serif" font-size="15" fill="#8ea1bd">3. Complete the SMS verification when requested.</text><rect x="328" y="305" width="544" height="95" rx="13" fill="#0d1628" stroke="#293953"/><circle cx="356" cy="337" r="7" fill="#39d98a"/><text x="376" y="341" font-family="Arial,sans-serif" font-size="15" font-weight="bold" fill="#edf4ff">Persistent browser profile</text><text x="352" y="369" font-family="Arial,sans-serif" font-size="13" fill="#8ea1bd">Cookies are stored on the Kubernetes PVC, not in Git.</text><rect x="328" y="427" width="544" height="67" rx="12" fill="#38212a" stroke="#77323c"/><text x="350" y="453" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="#ffb4b4">Security note</text><text x="350" y="476" font-family="Arial,sans-serif" font-size="13" fill="#e8c5c9">Never expose noVNC to the public internet. Port-forward only.</text><text x="600" y="540" font-family="Arial,sans-serif" font-size="12" fill="#8394ae" text-anchor="middle">Vodafone Balance • v1.1.0</text></svg>